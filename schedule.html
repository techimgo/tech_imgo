<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2027 테크니컬 적중노트 · 드로우 당첨자 안내</title>
<style>
:root{--bg:#0d1a12;--g:#16301F;--g2:#21442f;--y:#C0AE58;--yl:#DACB78;--cream:#F2EEDC;--mut:#98a293}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000}
body{display:flex;justify-content:center;align-items:flex-start;overflow:auto;font-family:'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--cream)}
.stage{width:1080px;height:1920px;position:relative;flex:none;transform-origin:top center;overflow:hidden;padding:170px 90px 0;
background:radial-gradient(900px 800px at 50% 0%,rgba(46,98,68,.6),transparent 65%),radial-gradient(700px 600px at 50% 105%,rgba(192,174,88,.14),transparent 65%),var(--bg)}
.serif{font-family:'Noto Serif CJK KR','Noto Serif KR','Nanum Myeongjo',serif}
.brand{text-align:center;color:var(--y);font-size:30px;letter-spacing:8px}
.mail{position:relative;width:200px;height:140px;margin:56px auto 0;animation:float 3.4s ease-in-out infinite}
.mail .body{position:absolute;inset:0;border-radius:18px;background:linear-gradient(160deg,#DACB78,#C0AE58);box-shadow:0 18px 40px rgba(192,174,88,.3)}
.mail .flap{position:absolute;left:0;right:0;top:0;height:78px;clip-path:polygon(0 0,100% 0,50% 100%);background:rgba(255,255,255,.35);border-radius:18px 18px 0 0}
.mail .dot{position:absolute;right:-14px;top:-14px;width:44px;height:44px;border-radius:50%;background:#F2EEDC;color:#16301F;font-weight:800;font-size:26px;display:flex;align-items:center;justify-content:center;animation:pop 3.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-14px)}}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
h1{margin-top:52px;text-align:center;font-size:80px;line-height:1.28;font-weight:700;letter-spacing:-3px;word-break:keep-all}
h1 em{font-style:normal;color:var(--yl)}
.lead{margin-top:30px;text-align:center;font-size:38px;line-height:1.6;color:#d6d3c0;word-break:keep-all}
.lead b{color:var(--yl);font-weight:700}
.spam{margin:34px auto 0;width:max-content;font-size:30px;padding:12px 32px;border-radius:99px;border:1.5px solid rgba(218,203,120,.5);color:var(--yl)}
.sec{margin-top:70px;font-size:30px;color:var(--yl);display:flex;align-items:center;gap:18px}
.sec:after{content:"";flex:1;height:1px;background:rgba(192,174,88,.35)}
.tl{position:relative;margin-top:24px}
.tl:before{content:"";position:absolute;left:25px;top:34px;bottom:34px;width:2px;background:linear-gradient(var(--y),rgba(192,174,88,.2))}
.st{position:relative;display:flex;gap:30px;padding:14px 0;align-items:center}
.dot2{flex:none;width:52px;height:52px;border-radius:50%;background:var(--bg);border:2px solid var(--y);color:var(--y);display:flex;align-items:center;justify-content:center;font-family:'Liberation Serif',serif;font-size:26px;z-index:1}
.st.hot .dot2{background:var(--y);color:#16200f}
.st .t{font-size:36px;line-height:1.4;word-break:keep-all}
.st .t b{color:var(--yl)}
.st .t small{display:block;font-size:28px;color:var(--mut)}
.warn{margin-top:40px;padding:30px 36px;border-radius:26px;background:rgba(255,255,255,.04);border:1.5px solid rgba(192,174,88,.3);font-size:30px;line-height:1.6;color:#d6d3c0;word-break:keep-all}
.warn b{color:var(--cream)}
.cong{margin-top:56px;text-align:center;font-size:40px;font-weight:700;color:var(--yl)}
.foot{position:absolute;left:90px;right:90px;bottom:44px;text-align:center;font-family:'Liberation Serif',serif;font-style:italic;font-size:40px;color:var(--y)}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="brand">2027 · TECHNICAL</div>
  <div class="mail"><div class="body"></div><div class="flap"></div><div class="dot">✓</div></div>
  <h1 class="serif">적중노트 <em>드로우</em><br>당첨자 안내</h1>
  <p class="lead">당첨자 메일 <b>발송이 완료</b>되었습니다.<br>메일함을 확인해 주세요.</p>
  <div class="spam">스팸메일함도 함께 확인해 주세요</div>

  <div class="sec">당첨 후 진행</div>
  <div class="tl">
    <div class="st hot"><span class="dot2">1</span><div class="t"><b>당첨자 전용 구매폼</b> 작성</div></div>
    <div class="st"><span class="dot2">2</span><div class="t"><b>10.9(금) 18:00까지</b> 입금 완료</div></div>
    <div class="st"><span class="dot2">3</span><div class="t">전자책 <b>이메일 발송</b><small>10.9(금) 23:59 이전</small></div></div>
  </div>
  <div class="warn">※ 기한 내 구매폼 작성 및 입금이 완료되지 않으면 구매권은 <b>후순위 당첨자</b>에게 넘어갑니다.</div>
  <div class="cong">당첨되신 모든 선생님들, 축하드립니다 🎉</div>
  <div class="foot">Technical</div>
</div>
<script>
function fit(){var s=document.getElementById('stage');var k=Math.min(1,innerWidth/1080);s.style.transform='scale('+k+')';s.style.marginBottom=(1920*(k-1))+'px';}
fit();addEventListener('resize',fit);
</script>
</body>
</html>
