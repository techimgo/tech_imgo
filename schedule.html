<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2027 테크니컬 적중노트 · 2차 선착순 판매</title>
<style>
:root{--bg:#0d1a12;--g:#16301F;--g2:#21442f;--y:#C0AE58;--yl:#DACB78;--cream:#F2EEDC;--mut:#98a293}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000}
body{display:flex;justify-content:center;align-items:flex-start;overflow:auto;font-family:'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--cream)}
.stage{width:1080px;height:1920px;position:relative;flex:none;transform-origin:top center;overflow:hidden;padding:100px 90px 0;
background:radial-gradient(900px 800px at 50% 0%,rgba(46,98,68,.6),transparent 65%),radial-gradient(700px 600px at 50% 105%,rgba(192,174,88,.14),transparent 65%),var(--bg)}
.serif{font-family:'Noto Serif CJK KR','Noto Serif KR','Nanum Myeongjo',serif}
.brand{text-align:center;color:var(--y);font-size:30px;letter-spacing:8px}
h1{margin-top:44px;text-align:center;font-size:84px;line-height:1.28;font-weight:700;letter-spacing:-3px;word-break:keep-all}
h1 em{font-style:normal;color:var(--yl)}
.lead{margin-top:44px;text-align:center;font-size:38px;line-height:1.65;color:#d6d3c0;word-break:keep-all}
/* 타임라인 */
.flow{margin-top:70px;display:flex;align-items:stretch;gap:0}
.card{flex:1;border-radius:30px;padding:40px 36px;border:1.5px solid rgba(192,174,88,.3);background:rgba(255,255,255,.03)}
.card .k{font-size:26px;letter-spacing:3px;color:var(--mut)}
.card .d{margin-top:10px;font-size:84px;font-weight:700;letter-spacing:-3px;line-height:1.05}
.card .t{margin-top:12px;font-size:32px;line-height:1.4}
.card.done{opacity:.8}
.card.done .d{color:var(--mut)}
.card.done .t{color:var(--mut)}
.chip{display:inline-block;margin-top:18px;font-size:26px;color:var(--yl);border:1.5px solid rgba(218,203,120,.5);padding:6px 20px;border-radius:99px}
.arrow{width:70px;display:flex;align-items:center;justify-content:center;color:var(--y);font-size:44px}
.card.now{background:linear-gradient(160deg,var(--g2),var(--g));border:2px solid var(--y);box-shadow:0 0 0 0 rgba(218,203,120,.35);animation:glow 3s ease-in-out infinite}
.card.now .k{color:var(--y);font-weight:700}
.card.now .d{color:var(--yl)}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(218,203,120,.0)}50%{box-shadow:0 0 50px 6px rgba(218,203,120,.28)}}
.note{margin-top:60px;text-align:center;font-size:38px;line-height:1.6;color:var(--cream);word-break:keep-all}
.note b{color:var(--yl)}
/* 링크 */
.cta{position:relative;display:block;margin:56px auto 0;width:100%;text-decoration:none;text-align:center;border-radius:99px;overflow:hidden;background:linear-gradient(180deg,#DACB78,#C0AE58);color:#16200f;padding:50px 20px;box-shadow:0 18px 50px rgba(192,174,88,.25);animation:breathe 3s ease-in-out infinite}
.cta:before{content:"";position:absolute;top:0;bottom:0;width:140px;left:-200px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 4s ease-in-out infinite}
.cta .m{position:relative;font-size:64px;font-weight:800;letter-spacing:-2px}
.cta .m b{display:inline-block;margin-left:14px;animation:nudge 1.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);box-shadow:0 18px 50px rgba(192,174,88,.22)}50%{transform:scale(1.02);box-shadow:0 18px 70px rgba(218,203,120,.5)}}
@keyframes shine{0%{left:-200px}45%,100%{left:1300px}}
@keyframes nudge{50%{transform:translateX(12px)}}
.url{margin-top:30px;text-align:center;font-size:36px;color:var(--yl);letter-spacing:1px}
.url u{text-underline-offset:10px;text-decoration-thickness:2px}
.sub{margin-top:50px;padding-top:34px;border-top:1px solid rgba(192,174,88,.3);text-align:center;font-size:30px;line-height:1.7;color:var(--mut)}
.sub b{color:var(--cream);font-weight:500}
.foot{position:absolute;left:90px;right:90px;bottom:44px;text-align:center;font-family:'Liberation Serif',serif;font-style:italic;font-size:40px;color:var(--y)}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="brand">2027 · TECHNICAL</div>
  <h1 class="serif">1차에 조기 마감된<br><em>그 적중노트,</em><br>오늘 한 번 더 열립니다.</h1>
  <p class="lead">많은 분들이 먼저 선택해 주셨습니다.<br>한정 수량이라, 2차도 소진되면 마감됩니다.</p>

  <div class="flow">
    <div class="card done"><div class="k">1차</div><div class="d serif">10.1</div><div class="t">한정 수량 선착순</div><span class="chip">조기 마감</span></div>
    <div class="arrow">›</div>
    <div class="card now"><div class="k">2차 · 오늘</div><div class="d serif">10.5 월</div><div class="t"><b style="font-size:46px;color:var(--cream)">17:00</b> 선착순 오픈</div><span class="chip">한정 수량</span></div>
  </div>

  <a class="cta" href="https://naver.me/539KeLet" target="_blank" rel="noopener"><span class="m">적중노트 신청하기<b>→</b></span></a>
  <div class="url">링크 &nbsp;<u>naver.me/539KeLet</u></div>

  <div class="sub">선착순이 어렵다면 <b>10.7(수) 추첨 판매 신청</b> · 10.8(목) 당첨자 안내<br>입금 마감 10.9(금) 18:00 · <b>10.9 23:59 이전 발송</b></div>
  <div class="foot">Technical</div>
</div>
<script>
function fit(){var s=document.getElementById('stage');var k=Math.min(1,innerWidth/1080);s.style.transform='scale('+k+')';s.style.marginBottom=(1920*(k-1))+'px';}
fit();addEventListener('resize',fit);
</script>
</body>
</html>
